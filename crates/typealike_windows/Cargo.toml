[package]
name = "typealike_windows"
description = "Windows platform layer for TypeAlike (hooks, UI Automation, overlay, input)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Writes the records of the suggestion log (target `typealike_suggestions`), which hold the text of
# the user. The bin enables it with its own `suggestion-log` feature.
suggestion-log = ["windows/Win32_System_ProcessStatus"]

[target.'cfg(windows)'.dependencies]
typealike_core.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows.workspace = true
windows-reactor.workspace = true

[lints]
workspace = true

[package]
name = "ghosttype"
description = "System-wide inline autocomplete"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "GhostType"
path = "src/main.rs"

[features]
# Builds the GPU backends that the General pane offers. Each needs its SDK at build time (the
# Vulkan SDK, the CUDA Toolkit) and its runtime at run time (a GPU driver, the CUDA DLLs).
vulkan = ["ghosttype_llm/vulkan"]
cuda = ["ghosttype_llm/cuda"]
# Puts a private copy of the Windows App Runtime next to the program, so GhostType runs without
# the installed runtime. The Windows installers use it. It adds about 30 MB.
self-contained = ["dep:windows-reactor-setup"]

[dependencies]
anyhow.workspace = true
ghosttype_core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
windows-reactor-setup = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ghosttype_history.workspace = true
ghosttype_llm.workspace = true
ghosttype_models.workspace = true
ghosttype_settings.workspace = true

[target.'cfg(windows)'.dependencies]
ghosttype_windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ghosttype_macos.workspace = true

[lints]
workspace = true

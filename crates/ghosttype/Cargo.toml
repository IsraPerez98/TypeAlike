[package]
name = "ghosttype"
description = "System-wide inline autocomplete"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "GhostType"
path = "src/main.rs"

[features]
# Builds the GPU backends that the General pane offers. Each needs its SDK at build time (the
# Vulkan SDK, the CUDA Toolkit) and its runtime at run time (a GPU driver, the CUDA DLLs).
vulkan = ["ghosttype_llm/vulkan"]
cuda = ["ghosttype_llm/cuda"]

[dependencies]
anyhow.workspace = true
ghosttype_core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ghosttype_llm.workspace = true
ghosttype_models.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
ghosttype_windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ghosttype_macos.workspace = true

[lints]
workspace = true

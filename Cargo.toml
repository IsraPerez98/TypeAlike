[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/ghosttype"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IsraPerez98/GhostType"
publish = false

# Every dependency is declared here once and inherited with `foo.workspace = true`.
[workspace.dependencies]
ghosttype_core = { path = "crates/ghosttype_core" }
ghosttype_windows = { path = "crates/ghosttype_windows" }
ghosttype_macos = { path = "crates/ghosttype_macos" }
ghosttype_models = { path = "crates/ghosttype_models" }
ghosttype_llm = { path = "crates/ghosttype_llm" }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
llama-cpp-2 = { version = "0.1.159", default-features = false }
llama-cpp-sys-2 = { version = "0.1.159", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = { version = "=0.3.1", default-features = false }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSTimer",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSKeyValueBinding",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSSearchField",
    "NSStackView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTabView",
    "NSTabViewController",
    "NSTabViewItem",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Selected restriction lints.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unwrap_used = "warn"
# The windows crate family pulls in duplicate versions we can't control.
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

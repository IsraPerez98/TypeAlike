name: Release

# A tag vX.Y.Z builds the installers and makes a draft release with them. A manual run builds the
# installers as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Read the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not agree with the version $version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    # The macOS 26 SDK gives the AppKit controls the Liquid Glass look.
    runs-on: macos-26
    # Only a tag gets the signing certificate, after an approval of the release environment.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      # With an older target, the @available(macOS 15.0) checks of llama.cpp need the clang runtime,
      # which the Rust link does not include.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --release --locked
      # After the build, so that no build script runs while the private key is on the runner.
      - name: Import the signing certificate
        if: github.ref_type == 'tag'
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_P12_PASSWORD" ]; then
            echo "::error::The release environment has no MACOS_SIGNING_P12 or MACOS_SIGNING_P12_PASSWORD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign --keychain finds no identity in a keychain outside the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build the disk image
        run: sh packaging/macos/build-dmg.sh "${{ needs.version.outputs.version }}" target/release/TypeAlike dist
      - name: Remove the signing certificate
        if: always() && github.ref_type == 'tag'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    name: windows (${{ matrix.flavor }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: vulkan
            features: vulkan
          - flavor: cuda
            features: vulkan,cuda
    env:
      # The Vulkan shader build goes past MAX_PATH in a longer target folder.
      CARGO_TARGET_DIR: C:\t
      # The Visual Studio generator finds no CUDA toolset.
      CMAKE_GENERATOR: Ninja
      CUDA_VERSION: 13.2.2
      VULKAN_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the MSVC 14.44 toolset
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $toolset = Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Directory -Filter '14.44.*' | Select-Object -Last 1
          if (-not $toolset) { throw "no MSVC 14.44 toolset in $visualStudio" }
          "VCToolsVersion=$($toolset.Name)" >> $env:GITHUB_ENV

      - name: Install the Vulkan SDK
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          curl.exe --fail --location --silent --show-error --output $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          $install = Start-Process $installer -ArgumentList '--root', 'C:\VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the Vulkan SDK installer stopped with exit code $($install.ExitCode)" }
          if (-not (Test-Path 'C:\VulkanSDK\Bin\glslc.exe')) { throw 'the Vulkan SDK has no glslc.exe' }
          'VULKAN_SDK=C:\VulkanSDK' >> $env:GITHUB_ENV
          'C:\VulkanSDK\Bin' >> $env:GITHUB_PATH

      - name: Install the CUDA Toolkit
        if: matrix.flavor == 'cuda'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'
          $redist = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest = Invoke-RestMethod "$redist/redistrib_$env:CUDA_VERSION.json"
          $cuda = New-Item -ItemType Directory -Path 'C:\cuda'
          foreach ($component in 'cuda_nvcc', 'cuda_crt', 'libnvvm', 'cuda_cudart', 'cuda_cccl', 'libcublas') {
            $archive = $manifest.$component.'windows-x86_64'
            $zip = Join-Path $env:RUNNER_TEMP "$component.zip"
            Invoke-WebRequest "$redist/$($archive.relative_path)" -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $archive.sha256) { throw "$component.zip has the wrong SHA-256" }
            & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $cuda --strip-components 1
          }
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          "CUDACXX=$cuda\bin\nvcc.exe" >> $env:GITHUB_ENV
          # Only the GPUs of Windows desktops. For a data-center GPU, the driver compiles the Turing code.
          "CMAKE_CUDA_ARCHITECTURES=75-virtual;86-real;89-real;120a-real" >> $env:GITHUB_ENV
          "$cuda\bin" >> $env:GITHUB_PATH

      - name: Build
        run: cargo build --release --locked --features "${{ matrix.features }},self-contained"

      - name: Stage the installer files
        run: packaging\windows\stage.ps1 -Release "$env:CARGO_TARGET_DIR\release" -Destination dist\app ${{ matrix.flavor == 'cuda' && '-CudaPath C:\cuda' || '' }}

      - name: Build the installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=${{ needs.version.outputs.version }}"
          "/DFlavor=${{ matrix.flavor }}"
          "/DStagingDir=$PWD\dist\app"
          "/O$PWD\dist"
          packaging\windows\TypeAlike.iss

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.flavor }}
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Make a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "TypeAlike $GITHUB_REF_NAME"
